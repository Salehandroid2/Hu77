        # Create gradlew and gradle/wrapper for the build
        # This is a simplified version, in a real project you'd copy from a template
        echo '#!/bin/bash' > gradlew
        echo 'DEFAULT_JVM_OPTS="-Xmx512m -Dorg.gradle.daemon=false"' >> gradlew
        echo 'exec java $DEFAULT_JVM_OPTS -jar "$(dirname "$0")"/gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
        chmod +x gradlew

        mkdir -p gradle/wrapper
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

        # Navigate to the project root for subsequent steps
        cd ..

    - name: Grant execute permission for gradlew
      run: chmod +x AndroidExam2/gradlew

    - name: Build with Gradle
      run: cd AndroidExam2 && ./gradlew build
      continue-on-error: true

    - name: Build Debug APK
      run: cd AndroidExam2 && ./gradlew assembleDebug
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: AndroidExam2/app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK (Optional - requires signing config)
      run: cd AndroidExam2 && ./gradlew assembleRelease
      continue-on-error: true

    - name: Upload Release APK (Optional)
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: AndroidExam2/app/build/outputs/apk/release/app-release-unsigned.apk
      if: success() # Only upload if the assembleRelease step was successful
